name: Instagram Comment → DM Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # runs every 5 minutes, 24 / 7
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Cache the processed-comments file between runs ──────────────────
      - name: Cache processed comments
        uses: actions/cache@v4
        with:
          path: processed_comments.json
          key: processed-comments-${{ github.run_id }}
          restore-keys: |
            processed-comments-

      # ── 3. Set up Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 4. Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: pip install requests

      # ── 5. Run the bot ──────────────────────────────────────────────────────
      - name: Run bot
        env:
          ACCESS_TOKEN:        ${{ secrets.ACCESS_TOKEN }}
          IG_USER_ID:          ${{ vars.IG_USER_ID }}
          KEYWORD:             ${{ vars.KEYWORD }}
          COMMENT_REPLY_TEXT:  ${{ vars.COMMENT_REPLY_TEXT }}
          DM_TEXT:             ${{ vars.DM_TEXT }}
        run: python bot.py
