name: Instagram Daily Agent

on:
  schedule:
    - cron: '0 0 * * *'  # Runs once every 24 hours (Midnight UTC)
  workflow_dispatch:     # Allows you to click "Run workflow" manually

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Agent
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          KEYWORD: ${{ secrets.KEYWORD }}
          COMMENT_REPLY_TEXT: ${{ secrets.COMMENT_REPLY_TEXT }}
          DM_TEXT: ${{ secrets.DM_TEXT }}
        run: python bot.py

      - name: Save Progress
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create the file if it doesn't exist to prevent git add errors
          touch processed_comments.json 
          git add processed_comments.json
          
          # Only commit and push if there are actual changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: update processed comments log [skip ci]"
            git push
          else
            echo "No new comments to save."
          fi
