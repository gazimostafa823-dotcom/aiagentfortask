name: Instagram Comment Bot

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run the bot script
        env:
          # Pass secrets and variables to the Python script
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          PAGE_ID: ${{ vars.PAGE_ID }}
          KEYWORD: ${{ vars.KEYWORD }}
          COMMENT_REPLY_TEXT: ${{ vars.COMMENT_REPLY_TEXT }}
          DM_TEXT_TEMPLATE: ${{ vars.DM_TEXT }}
          YOUR_LINK: ${{ vars.YOUR_LINK }}
        run: python bot.py
      
      - name: Commit processed comments file
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add processed_comments.txt
          # Check if there are changes to commit
          git diff --staged --quiet || git commit -m "Update processed comments log"
          git push
