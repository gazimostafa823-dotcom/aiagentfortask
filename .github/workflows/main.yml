name: Instagram Daily Agent

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # Runs at 00:00, 06:00, 12:00, 18:00 UTC (4 times daily)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Agent
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          KEYWORD: ${{ secrets.KEYWORD }}
          COMMENT_REPLY_TEXT: ${{ secrets.COMMENT_REPLY_TEXT }}
          DM_TEXT: ${{ secrets.DM_TEXT }}
        run: python bot.py

      - name: Save Progress
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_comments.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update processed log" && git push)
